{% extends "base.html" %}
{% block title %}Nouvel incident{% endblock %}
{% block content %}
<h1>Signaler un incident</h1>

<form method="post" class="carte">
  <label>Titre
    <input name="titre" required maxlength="120" value="{{ form.get('titre', '') }}">
  </label>
  <label>Description
    <textarea name="description" required rows="4">{{ form.get('description', '') }}</textarea>
  </label>
  <label>Lieu (salle ou laboratoire)
    <input name="lieu" required maxlength="60" placeholder="Ex : Labo 3, Salle B12" value="{{ form.get('lieu', '') }}">
  </label>
  <label>Priorité
    <select name="priorite">
      {% for p in priorites %}
        <option value="{{ p }}" {% if form.get('priorite') == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </label>
  <button class="btn" type="submit">Enregistrer</button>
</form>
{% endblock %}
