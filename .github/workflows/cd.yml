name: CD - Publication dans GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:   # permet aussi un lancement manuel depuis l'onglet Actions

jobs:
  # ---------- Job 1 : les tests doivent réussir avant toute publication ----------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executer les tests
        run: python -m pytest -v

  # ---------- Job 2 : construire puis publier l'image ----------
  publish:
    name: Construction et publication de l'image
    runs-on: ubuntu-latest
    needs: test            # ne démarre QUE si le job "test" a réussi
    permissions:
      contents: read
      packages: write      # autorise GITHUB_TOKEN à écrire dans GHCR

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Definir le nom de l'image (en minuscules, obligatoire pour GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gestion-incidents" >> "$GITHUB_ENV"

      - name: Construire l'image Docker (2 tags latest + sha)
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} \
            .

      - name: Se connecter a GHCR avec le GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image dans GHCR
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Resume
        run: |
          echo "Image publiee :" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
